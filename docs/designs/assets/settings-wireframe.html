<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DesktopSplit 设置线框</title>
  <style>
    /* Low-fidelity wireframe: the preview is the primary control, not decoration. */
    :root { font-family: "Segoe UI", system-ui, sans-serif; color: #202020; background: #f4f4f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 900px; }
    .window { width: 1100px; margin: 32px auto; border: 1px solid #888; background: #fff; box-shadow: 0 5px 18px #0002; }
    .titlebar { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #aaa; background: #eee; font-size: 14px; }
    .body { display: grid; grid-template-columns: 190px 1fr; min-height: 650px; }
    nav { padding: 16px 10px; border-right: 1px solid #bbb; background: #fafafa; }
    nav div { padding: 10px; margin-bottom: 5px; border: 1px solid transparent; }
    nav .active { border-color: #777; background: #fff; }
    main { padding: 24px 30px; }
    h1 { margin: 0 0 4px; font-size: 23px; }
    .muted { color: #666; font-size: 13px; }
    .preview { margin-top: 24px; padding: 18px; border: 1px solid #999; background: #fafafa; }
    .monitor { display: flex; height: 270px; border: 3px solid #555; background: #ddd; }
    .zone { display: flex; align-items: center; justify-content: center; position: relative; border-right: 2px dashed #777; background: #fff; }
    .zone:last-child { border-right: 0; background: #f0f0f0; }
    .zone strong { font-size: 18px; }
    .zone small { position: absolute; bottom: 10px; color: #555; }
    .divider { width: 8px; margin: -3px -4px; z-index: 2; cursor: ew-resize; background: #333; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 20px; }
    label { display: block; font-size: 13px; color: #555; }
    input, select { width: 100%; margin-top: 6px; padding: 8px; border: 1px solid #999; background: #fff; }
    .presets { display: flex; gap: 8px; margin-top: 22px; }
    button { padding: 8px 14px; border: 1px solid #777; background: #fff; cursor: pointer; }
    button.primary { color: #fff; background: #333; }
    .footer { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 18px; border-top: 1px solid #bbb; }
    .tray { padding: 10px 14px; border-top: 1px solid #bbb; color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <section class="window">
    <header class="titlebar"><span>DesktopSplit 设置</span><span>— □ ×</span></header>
    <div class="body">
      <nav>
        <div class="active">当前布局</div>
        <div>预设布局</div>
        <div>通用设置</div>
        <div>关于</div>
      </nav>
      <main>
        <h1>当前布局</h1>
        <div class="muted">显示器 1 · 2560 × 1440 · 比例布局</div>
        <section class="preview">
          <div class="muted">拖动中间分割线调整区域比例</div>
          <div class="monitor" aria-label="4/5 与 1/5 的显示器分区预览">
            <div class="zone" style="width:80%"><strong>区域 1</strong><small>80% · 主工作区</small></div>
            <div class="divider" title="拖动调整比例"></div>
            <div class="zone" style="width:20%"><strong>区域 2</strong><small>20% · 侧栏区</small></div>
          </div>
        </section>
        <section class="controls">
          <label>分区数量<select><option>2</option><option>3</option><option>4</option></select></label>
          <label>当前分割比例<input value="80% / 20%" readonly></label>
          <label>默认预设<select><option>当前布局</option><option>左右均分</option><option>三列布局</option></select></label>
        </section>
        <div class="presets">
          <button>左右均分</button><button>三列布局</button><button>保存为新预设</button>
        </div>
        <div class="footer">
          <span class="muted">修改后只调整已最大化窗口，普通窗口不移动。</span>
          <span><button>取消</button> <button class="primary">应用</button></span>
        </div>
      </main>
    </div>
    <div class="tray">托盘状态：分区已启用　·　右键托盘图标：打开设置 / 暂停分区 / 退出</div>
  </section>
</body>
</html>
